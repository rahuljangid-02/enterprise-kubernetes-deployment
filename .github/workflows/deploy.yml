
name: Weather API CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-api-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # STEP 1: Run automated tests
  test:
    name: Test Weather API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v


  # STEP 2: Deploy only when manually triggered
  deploy:
    name: Deploy Weather API to AKS
    needs: test

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      RESOURCE_GROUP: rg-weather-k8s
      AKS_CLUSTER: aks-weather-demo
      ACR_NAME: weatheracr2026abc42
      IMAGE: weatheracr2026abc42.azurecr.io/weather-api:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check AKS is running
        shell: bash
        run: |
          STATE=$(az aks show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --query "powerState.code" \
            -o tsv)

          echo "AKS power state: $STATE"

          if [ "$STATE" != "Running" ]; then
            echo "::error::AKS is not running. Start the cluster manually first."
            exit 1
          fi

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE" .

      - name: Push Docker image to ACR
        run: |
          docker push "$IMAGE"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.8"

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Deploy new image
        run: |
          kubectl set image \
            deployment/weather-api \
            weather-api="$IMAGE" \
            --namespace default

      - name: Verify deployment rollout
        run: |
          kubectl rollout status \
            deployment/weather-api \
            --namespace default \
            --timeout=300s

          kubectl get deployment weather-api \
            --namespace default

          kubectl get pods \
            --namespace default \
            -l app=weather-api
