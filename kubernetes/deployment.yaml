
apiVersion: apps/v1
kind: Deployment

metadata:
  name: weather-api
  labels:
    app: weather-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: weather-api

  template:
    metadata:
      labels:
        app: weather-api

    spec:
      containers:
        - name: weather-api

          image: YOUR_ACR_LOGIN_SERVER/weather-api:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
