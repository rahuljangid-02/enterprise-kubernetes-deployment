
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: weather-api-ingress

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - weather-k8s-youruniquename.centralindia.cloudapp.azure.com
      secretName: weather-api-tls

  rules:
    - host: weather-k8s-youruniquename.centralindia.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-api-service
                port:
                  number: 8000
