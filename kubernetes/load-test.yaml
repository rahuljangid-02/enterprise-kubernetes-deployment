
apiVersion: v1
kind: Pod

metadata:
  name: weather-load-generator

spec:
  restartPolicy: Never

  # Automatically stop the test after 3 minutes
  activeDeadlineSeconds: 180

  containers:
    - name: generator
      image: busybox:1.36

      command:
        - /bin/sh
        - -c

      args:
        - |
          for i in 1 2 3; do
            (
              while true; do
                wget -q -O /dev/null \
                  "http://weather-api-service:8000/weather?city=Jaipur" || true
              done
            ) &
          done
          wait

      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "300m"
          memory: "64Mi"
